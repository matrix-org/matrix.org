# Upcoming events shown in the "Upcoming Events" table of TWIM posts.
# One-off events get a date (and optionally an end_date). Events on a fixed
# schedule use weekday (1 = Monday ... 7 = Sunday) and nth (1-4) instead of a
# date, e.g. weekday = 2, nth = 3 is the third Tuesday of every month. Leave
# nth out for a weekly event. Events with changing venues or URLs are listed
# as one entry per date. Entries are hidden once their date has passed.

