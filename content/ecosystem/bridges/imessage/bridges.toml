[[bridges]]
name = "mautrix-imessage"
maintainer = "Tulir"
summary = """
A Matrix-iMessage puppeting bridge.
"""
maturity = "Beta"
language = "Go"
license = "AGPL-3.0-or-later"
docs = "https://docs.mau.fi/bridges/go/imessage/index.html"
repo = "https://github.com/mautrix/imessage"
room = "#imessage:maunium.net"
