<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="100%" height="100%" fill="#EEEDFD"/>
  <title>Axon</title>
  <!--
    A neuron, composed on the square's diagonal: dendrites at lower left, the
    soma, then one axon running up and right and arborising into three
    terminals, the upper of which branches again.

    Two stroke weights, which is what keeps it from reading as a diagram: the
    soma and axon carry the mass at 104, and the dendrites and terminals taper
    to 80. Branch points are deliberately staggered and the angles deliberately
    uneven — evenly spaced branches of equal length read as a snowflake rather
    than a cell.

    Legibility sets the ceiling on detail. This is drawn to survive 32px, which
    is the size a Linux launcher and a Windows taskbar actually use; every
    further branch costs separation there first. Check `icons/32x32.png` before
    adding one.

    Plain geometry on purpose. No text, no filters, no external references —
    `tauri icon` rasterises with resvg rather than a browser engine, and those
    are where renderers disagree. Strokes rather than filled paths so weight
    can be changed in one place.

    Transparent by design: a browser tab, a Linux launcher, a Windows taskbar
    and the macOS Dock all draw a shaped icon. The two places that need an
    opaque square composite one themselves — `tauri icon` for the iOS set, and
    `scripts/build-web-icons.sh` for the apple-touch icons, which iOS would
    otherwise render on black.

    This is the master for *both* clients. The browser loads it directly as the
    favicon, and `tauri icon` rasterises the desktop set from it. One file, so
    the two cannot drift; `icons-regenerated` enforces that they are
    regenerated together.
  -->
  <g fill="none" stroke="#5142E6" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="80">
      <path d="M206 628 Q112 578 96 512" />
      <path d="M262 828 Q216 912 138 934" />
    </g>
    <g stroke-width="104">
      <circle cx="342" cy="700" r="172" />
      <path d="M464 578 Q560 484 654 390" />
    </g>
    <g stroke-width="80">
      <path d="M654 390 Q792 368 924 402" />
      <path d="M654 390 Q672 248 646 122" />
      <path d="M660 214 Q752 190 822 132" />
      <path d="M654 390 Q806 452 872 588" />
    </g>
  </g>
</svg>
